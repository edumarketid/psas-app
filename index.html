<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .device-frame-mobile {
            max-width: 414px;
            height: 844px;
            margin: 0 auto;
            border: 12px solid #1f2937;
            border-radius: 40px;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .device-frame-desktop {
            max-width: 100%;
            height: 100vh;
            border: none;
            border-radius: 0;
            overflow-y: auto;
        }
        #print-area { display: none; }
        @media print {
            @page { size: A4; margin: 10mm; }
            body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
            body > *:not(#print-area) { display: none !important; }
            #print-area { display: block !important; color: #000; font-family: Arial, Helvetica, sans-serif; }

            .pa-card { border: 1.5px solid #000; border-radius: 3mm; padding: 4mm; height: 62mm; box-sizing: border-box; break-inside: avoid; font-size: 10pt; }
            .pa-card h4 { margin: 0; font-size: 10pt; text-align: center; letter-spacing: .5px; }
            .pa-card .sub { text-align: center; font-size: 8pt; border-bottom: 1px solid #000; padding-bottom: 2mm; margin-bottom: 2mm; }
            .pa-card table { width: 100%; border-collapse: collapse; }
            .pa-card td { padding: 1px 0; vertical-align: top; }
            .pa-card td:first-child { width: 26mm; }
            .pa-card .mono { font-family: "Courier New", monospace; font-weight: bold; font-size: 12pt; }
            .pa-card .note { font-size: 7pt; margin-top: 2mm; font-style: italic; }
            .ba { font-size: 11pt; line-height: 1.5; }
            .ba h2 { text-align: center; margin: 0; font-size: 13pt; }
            .ba table.info td { padding: 2px 6px; vertical-align: top; }
            .ba table.list { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-top: 4mm; }
            .ba table.list th, .ba table.list td { border: 1px solid #000; padding: 2px 5px; }
            .ba .sign { display: flex; justify-content: space-between; margin-top: 14mm; text-align: center; }
            .ba .sign div { width: 45%; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex flex-col h-screen overflow-hidden">

    <!-- Top Bar Pengaturan Tampilan & Koneksi -->

            <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>

        <div class="flex items-center space-x-3">

                <button onclick="setDeviceMode('mobile')" id="btn-mobile" class="px-3 py-1.5 text-xs font-medium bg-slate-700 text-white rounded-l-lg hover:bg-slate-600 border border-slate-600 transition">
                    <i class="fa-solid fa-mobile-screen mr-1"></i> HP
                </button>
                <button onclick="setDeviceMode('desktop')" id="btn-desktop" class="px-3 py-1.5 text-xs font-medium bg-slate-900 text-slate-300 rounded-r-lg hover:bg-slate-700 border border-slate-600 transition">
                    <i class="fa-solid fa-desktop mr-1"></i> Desktop
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container dengan Dynamic Device Wrapper -->
    <main class="flex-1 flex justify-center items-center bg-slate-950 p-0 sm:p-4 overflow-hidden">
        <div id="device-container" class="device-frame-desktop w-full bg-slate-900 flex flex-col transition-all duration-300 relative shadow-2xl">
            
            <!-- App Header (Branding SMKN 1 Wakatobi) -->
            <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white p-4 border-b border-indigo-800 flex justify-between items-center shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2.5 rounded-xl shadow">
                        <i class="fa-solid fa-graduation-cap text-xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm sm:text-base tracking-wide" id="lbl-school-name">SMKN 1 Wakatobi</h1>
                        <p class="text-xs text-blue-200" id="lbl-semester-info">Penilaian Sumatif Akhir Semester (SAS)</p>
                    </div>
                </div>
                <div id="header-auth-status">
                    <!-- Dynamic Auth Status / Logout Button -->
                </div>
            </div>

            <!-- App Body Content Area -->
            <div id="app-content" class="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-900">
                <!-- Rendered dynamically -->
            </div>

            <!-- Footer -->
            <footer class="bg-slate-900 border-t border-slate-800 py-2 text-center text-xs text-slate-500">
                &copy; 2026 Tim Kurikulum SMKN 1 Wakatobi &bull; Supabase Backend Connected
            </footer>

        </div>
    </main>

    <!-- Modal Notifikasi / Alert Global -->
    <div id="global-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div id="modal-icon" class="text-4xl mb-3 text-emerald-400">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-white mb-1">Berhasil</h3>
            <p id="modal-message" class="text-sm text-slate-300 mb-6">Pesan informasi sistem.</p>
            <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg">OK</button>
        </div>
    </div>

    <!-- Area cetak (kartu peserta & berita acara) -->
    <div id="print-area"></div>

    <!-- Script Logika Aplikasi -->
    <script>
        // ==========================================
        // KONFIGURASI SUPABASE (Ganti dengan kredensial Anda)
        // ==========================================
        const SUPABASE_URL = 'https://xtsvuydmdyirsnzrrzmt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0c3Z1eWRtZHlpcnNuenJyem10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzA3MjYsImV4cCI6MjEwODc0NjcyNn0.ilTHrt7MYhzhIuctiWedrV8neh1TCS_hIrehmEqSWsI';
        
        // Inisialisasi Klien Supabase (jika kredensial belum diisi, fallback ke mode lokal/demo)
        let supabaseClient = null;
        try {
            if (SUPABASE_URL !== 'https://YOUR_PROJECT_REF.supabase.co') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Supabase belum dikonfigurasi dengan benar, menggunakan state memori lokal.");
        }

        // State Aplikasi
        let currentUser = null; // { role: 'admin'|'teacher'|'student', data: {...} }
        let currentSettings = { school_name: 'SMKN 1 Wakatobi', headmaster_name: 'Drs. La Ode...', headmaster_nip: '1968...', academic_year: '2026/2027', semester: 'Ganjil' };

        // Toggle Tampilan Perangkat (HP / Desktop)
        function setDeviceMode(mode) {
            const container = document.getElementById('device-container');
            const btnMobile = document.getElementById('btn-mobile');
            const btnDesktop = document.getElementById('btn-desktop');

            if (mode === 'mobile') {
                container.className = "device-frame-mobile w-full bg-slate-900 flex flex-col transition-all duration-300 relative shadow-2xl";
                btnMobile.className = "px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-l-lg border border-blue-500";
                btnDesktop.className = "px-3 py-1.5 text-xs font-medium bg-slate-900 text-slate-300 rounded-r-lg hover:bg-slate-700 border border-slate-600";
            } else {
                container.className = "device-frame-desktop w-full bg-slate-900 flex flex-col transition-all duration-300 relative shadow-2xl";
                btnDesktop.className = "px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-r-lg border border-blue-500";
                btnMobile.className = "px-3 py-1.5 text-xs font-medium bg-slate-900 text-slate-300 rounded-l-lg hover:bg-slate-700 border border-slate-600";
            }
        }

        function showModal(title, message, type = 'success') {
            const modal = document.getElementById('global-modal');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-message');
            const iconEl = document.getElementById('modal-icon');

            titleEl.innerText = title;
            msgEl.innerText = message;
            if (type === 'error') {
                iconEl.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-500"></i>';
            } else {
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('global-modal').classList.add('hidden');
        }

        // Inisialisasi Awal Saat Halaman Dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchSettings();
            renderHomeOrDashboard();
        });

        async function fetchSettings() {
            if (supabaseClient) {
                const { data } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
                if (data) currentSettings = data;
            }
            document.getElementById('lbl-school-name').innerText = currentSettings.school_name;
            document.getElementById('lbl-semester-info').innerText = `SAS TA ${currentSettings.academic_year} (${currentSettings.semester})`;
        }

        function renderAuthStatus() {
            const statusDiv = document.getElementById('header-auth-status');
            if (!currentUser) {
                statusDiv.innerHTML = `<span class="text-xs text-slate-400">Belum Login</span>`;
            } else {
                statusDiv.innerHTML = `
                    <button onclick="logout()" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1 rounded-lg text-xs font-medium transition flex items-center space-x-1">
                        <i class="fa-solid fa-right-from-bracket"></i> <span>Keluar</span>
                    </button>
                `;
            }
        }

        function logout() {
            clearInterval(examTimerInterval); clearInterval(tokenTimer); examRunning = false;
            currentUser = null;
            renderHomeOrDashboard();
            showModal('Logout Berhasil', 'Anda telah keluar dari sistem.');
        }

        // ==========================================
        // RENDER HALAMAN UTAMA / LOGIN PILIHAN
        // ==========================================
        function renderHomeOrDashboard() {
            renderAuthStatus();
            const content = document.getElementById('app-content');

            if (!currentUser) {
                content.innerHTML = `
                    <div class="max-w-md mx-auto space-y-6 my-auto pt-6">
                        <div class="text-center space-y-2">
                            <div class="inline-flex p-4 bg-blue-600/20 border border-blue-500/30 rounded-3xl text-blue-400 text-3xl mb-2">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-white">Portal Ujian Sumatif</h2>
                            <p class="text-sm text-slate-400">Pilih akses masuk sesuai peran Anda di SMKN 1 Wakatobi</p>
                        </div>

                        <!-- Tab Selector -->
                        <div class="flex rounded-xl bg-slate-800 p-1.5 border border-slate-700">
                            <button onclick="switchLoginTab('student')" id="tab-student" class="flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition shadow">Siswa</button>
                            <button onclick="switchLoginTab('teacher')" id="tab-teacher" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">Guru</button>
                            <button onclick="switchLoginTab('admin')" id="tab-admin" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">Admin</button>
                        </div>

                        <!-- Form Login Container -->
                        <div id="login-form-container" class="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl shadow-xl">
                            <!-- Rendered by switchLoginTab -->
                        </div>
                    </div>
                `;
                switchLoginTab('student');
            } else {
                if (currentUser.role === 'admin') renderAdminDashboard();
                else if (currentUser.role === 'teacher') renderTeacherDashboard();
                else if (currentUser.role === 'student') renderStudentDashboard();
            }
        }

        function switchLoginTab(role) {
            ['student', 'teacher', 'admin'].forEach(r => {
                const btn = document.getElementById(`tab-${r}`);
                if (r === role) {
                    btn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition shadow";
                } else {
                    btn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                }
            });

            const container = document.getElementById('login-form-container');
            if (role === 'student') {
                container.innerHTML = `
                    <form onsubmit="handleLogin(event, 'student')" class="space-y-4">
                        <h3 class="text-base font-bold text-white mb-2"><i class="fa-solid fa-user-graduate text-blue-400 mr-2"></i>Login Siswa</h3>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Nomor Induk Siswa Nasional (NISN)</label>
                            <input type="text" id="login-nisn" required placeholder="Contoh: 0081234567" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">PIN Siswa (Default: 12345)</label>
                            <input type="password" id="login-pin" required placeholder="•••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg text-sm">Masuk Ujian</button>
                    </form>
                `;
            } else if (role === 'teacher') {
                container.innerHTML = `
                    <form onsubmit="handleLogin(event, 'teacher')" class="space-y-4">
                        <h3 class="text-base font-bold text-white mb-2"><i class="fa-solid fa-chalkboard-user text-emerald-400 mr-2"></i>Login Guru Mapel</h3>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Nomor Handphone (WhatsApp)</label>
                            <input type="text" id="login-phone" required placeholder="Contoh: 081234567890" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">PIN Guru (Default: 12345)</label>
                            <input type="password" id="login-tpin" required placeholder="•••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg text-sm">Masuk Dashboard Guru</button>
                    </form>
                `;
            } else if (role === 'admin') {
                container.innerHTML = `
                    <form onsubmit="handleLogin(event, 'admin')" class="space-y-4">
                        <h3 class="text-base font-bold text-white mb-2"><i class="fa-solid fa-user-shield text-amber-400 mr-2"></i>Login Administrator</h3>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Username Admin</label>
                            <input type="text" id="login-admin-user" required value="admin" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Password (Default: 12345)</label>
                            <input type="password" id="login-admin-pass" required placeholder="•••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg text-sm">Masuk Panel Admin</button>
                    </form>
                `;
            }
        }

        async function handleLogin(e, role) {
            e.preventDefault();
            if (role === 'admin') {
                const u = document.getElementById('login-admin-user').value;
                const p = document.getElementById('login-admin-pass').value;
                if (supabaseClient) {
                    const { data } = await supabaseClient.from('admins').select('*').eq('username', u).eq('password', p).single();
                    if (data) {
                        currentUser = { role: 'admin', data };
                    } else {
                        showModal('Login Gagal', 'Username atau password admin salah!', 'error');
                        return;
                    }
                } else {
                    if (u === 'admin' && p === '12345') currentUser = { role: 'admin', data: { username: 'admin' } };
                    else { showModal('Login Gagal', 'Username/Password salah', 'error'); return; }
                }
            } else if (role === 'teacher') {
                const phone = document.getElementById('login-phone').value;
                const pin = document.getElementById('login-tpin').value;
                if (supabaseClient) {
                    const { data } = await supabaseClient.from('teachers').select('*').eq('phone', phone).eq('pin', pin).single();
                    if (data) currentUser = { role: 'teacher', data };
                    else { showModal('Login Gagal', 'No HP atau PIN Guru tidak terdaftar!', 'error'); return; }
                } else {
                    currentUser = { role: 'teacher', data: { id: 1, name: 'Guru Demo', phone } };
                }
            } else if (role === 'student') {
                const nisn = document.getElementById('login-nisn').value;
                const pin = document.getElementById('login-pin').value;
                if (supabaseClient) {
                    const { data } = await supabaseClient.from('students').select('*').eq('nisn', nisn).eq('pin', pin).single();
                    if (data) currentUser = { role: 'student', data };
                    else { showModal('Login Gagal', 'NISN atau PIN Siswa salah/tidak ditemukan!', 'error'); return; }
                } else {
                    currentUser = { role: 'student', data: { nisn, name: 'Siswa Demo', kelas: 'XI TKJ' } };
                }
            }
            renderHomeOrDashboard();
            showModal('Login Berhasil', `Selamat datang, ${currentUser.data.name || currentUser.data.username || 'Pengguna'}`);
        }

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        async function renderAdminDashboard() {
            const content = document.getElementById('app-content');
            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-white flex items-center"><i class="fa-solid fa-gauge text-amber-400 mr-2"></i>Panel Administrator</h2>
                            <p class="text-xs text-slate-400">Kelola kurikulum, data guru, siswa, jadwal ujian, dan aktivasi soal.</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="adminTab('settings')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl font-medium transition"><i class="fa-solid fa-gear mr-1"></i> Pengaturan</button>
                            <button onclick="adminTab('teachers')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl font-medium transition"><i class="fa-solid fa-chalkboard-user mr-1"></i> Data Guru</button>
                            <button onclick="adminTab('students')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl font-medium transition"><i class="fa-solid fa-user-graduate mr-1"></i> Data Siswa</button>
                            <button onclick="adminTab('exams')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs rounded-xl font-medium transition"><i class="fa-solid fa-file-shield mr-1"></i> Aktivasi & Jadwal Soal</button>
                            <button onclick="adminTab('token')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-xs rounded-xl font-medium transition"><i class="fa-solid fa-key mr-1"></i> Token Ujian</button>
                            <button onclick="adminTab('cards')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl font-medium transition"><i class="fa-solid fa-id-card mr-1"></i> Cetak Kartu</button>
                            <button onclick="adminTab('recap')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-xl font-medium transition"><i class="fa-solid fa-table-list mr-1"></i> Rekap & Berita Acara</button>
                        </div>
                    </div>
                    <div id="admin-content-area" class="bg-slate-800/50 border border-slate-700 rounded-2xl p-4 sm:p-6">
                        <!-- Default tab: Exams & Activation -->
                    </div>
                </div>
            `;
            adminTab('exams');
        }

        async function adminTab(tab) {
            const area = document.getElementById('admin-content-area');
            clearInterval(tokenTimer);
            if (['token', 'cards', 'recap'].includes(tab)) return adminTabExtra(tab, area);
            if (tab === 'settings') {
                area.innerHTML = `
                    <h3 class="text-base font-bold text-white mb-4"><i class="fa-solid fa-school text-blue-400 mr-2"></i>Pengaturan Identitas Sekolah & Tahun Ajaran</h3>
                    <form onsubmit="saveSettings(event)" class="space-y-4 max-w-xl">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Nama Sekolah</label>
                            <input type="text" id="set-school" value="${currentSettings.school_name || ''}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Nama Kepala Sekolah</label>
                                <input type="text" id="set-kepsek" value="${currentSettings.headmaster_name || ''}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">NIP Kepala Sekolah</label>
                                <input type="text" id="set-nip" value="${currentSettings.headmaster_nip || ''}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        // ==========================================
        // CBT ENGINE: token, sesi tahan-refresh, timer, auto-submit
        // ==========================================
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const SESS_KEY = 'cbt_session';
        let activeExamSession = null, currentQuestionIndex = 0, studentAnswers = {}, examTimerInterval = null;
        let examEndAt = 0, examRunning = false, examSubmitting = false, examViolations = 0, pendingPayload = null;
        let studentExams = [], doneExamIds = [];

        const examDurationMin = ex => ex.duration_minutes || ((ex.questions?.length || 0) * 2); // default 2 menit/soal

        function saveSession() {
            try { localStorage.setItem(SESS_KEY, JSON.stringify({ nisn: currentUser.data.nisn, examId: activeExamSession.id, endAt: examEndAt, answers: studentAnswers, idx: currentQuestionIndex, violations: examViolations })); } catch (e) {}
        }
        function clearSession() { try { localStorage.removeItem(SESS_KEY); } catch (e) {} }
        function loadSession() {
            try { const s = JSON.parse(localStorage.getItem(SESS_KEY)); return s && s.nisn === currentUser.data.nisn ? s : null; } catch (e) { return null; }
        }

        // Keamanan dasar: catat perpindahan tab/aplikasi, blok klik kanan & salin saat ujian
        document.addEventListener('visibilitychange', () => {
            if (!examRunning) return;
            if (document.hidden) { examViolations++; saveSession(); }
            else showModal('Peringatan', `Anda meninggalkan halaman ujian (${examViolations}x). Aktivitas ini tercatat dan dilaporkan ke pengawas.`, 'error');
        });
        ['contextmenu', 'copy', 'cut', 'paste'].forEach(ev => document.addEventListener(ev, e => { if (examRunning) e.preventDefault(); }));
        window.addEventListener('beforeunload', e => { if (examRunning) { e.preventDefault(); e.returnValue = ''; } });

        async function requestStartExam(id) {
            const ex = studentExams.find(e => e.id === id);
            if (!ex) return;
            if (!ex.questions || !ex.questions.length) { showModal('Tidak Tersedia', 'Paket soal ini belum memiliki butir soal.', 'error'); return; }
            if (supabaseClient) {
                const { data } = await supabaseClient.from('student_results').select('id').eq('student_nisn', currentUser.data.nisn).eq('exam_id', id).limit(1);
                if (data && data.length) { showModal('Sudah Dikerjakan', 'Anda sudah menyelesaikan ujian ini. Ujian tidak dapat diulang.', 'error'); renderStudentDashboard(); return; }
            }
            const input = prompt('Masukkan TOKEN ujian dari pengawas (6 digit):');
            if (!input) return;
            const t = await getToken();
            if (!t.code || input.trim() !== String(t.code)) {
                showModal('Token Tidak Valid', 'Token salah atau sudah diganti. Minta token terbaru kepada pengawas.', 'error');
                return;
            }
            if (!confirm(`Waktu ujian ${examDurationMin(ex)} menit. Timer akan langsung berjalan dan tidak dapat dihentikan. Mulai sekarang?`)) return;
            examEndAt = Date.now() + examDurationMin(ex) * 60000;
            examViolations = 0;
            startExam(ex, { answers: {}, idx: 0 });
        }

        function tryResumeExam() {
            const s = loadSession();
            if (!s) return;
            const ex = studentExams.find(e => e.id === s.examId);
            if (!ex || doneExamIds.includes(ex.id)) { clearSession(); return; }
            examEndAt = s.endAt; examViolations = s.violations || 0;
            startExam(ex, { answers: s.answers || {}, idx: s.idx || 0 });
        }

        function startExam(exam, resume) {
            activeExamSession = exam;
            currentQuestionIndex = resume.idx || 0;
            studentAnswers = resume.answers || {};
            examSubmitting = false; examRunning = true;
            saveSession();

            document.getElementById('app-content').innerHTML = `
                <div class="max-w-3xl mx-auto space-y-4">
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex justify-between items-center shadow">
                        <div>
                            <h3 class="font-bold text-white text-sm sm:text-base">${esc(exam.title)}</h3>
                            <p class="text-xs text-slate-400">${esc(exam.subject)} &bull; ${esc(currentUser.data.name)}</p>
                        </div>
                        <div id="timer-box" class="bg-rose-500/20 border border-rose-500/40 text-rose-400 px-3 py-1.5 rounded-xl text-xs font-mono font-bold flex items-center space-x-1.5">
                            <i class="fa-regular fa-clock"></i><span id="exam-timer">00:00:00</span>
                        </div>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4 select-none">
                        <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-700 pb-3">
                            <span>Soal Nomor <strong id="q-number" class="text-white text-sm">1</strong> dari ${exam.questions.length}</span>
                            <span id="answered-status" class="text-blue-400 font-semibold">Belum dijawab</span>
                        </div>
                        <div id="question-text" class="text-sm sm:text-base text-slate-100 font-medium leading-relaxed"></div>
                        <div id="options-container" class="space-y-3 pt-2"></div>
                    </div>
                    <div class="flex justify-between items-center">

        // ==========================================
        // TOKEN UJIAN OTOMATIS (refresh 15 menit)
        // ==========================================
        const TOKEN_MS = 15 * 60 * 1000;
        let tokenTimer = null, curToken = { code: null, at: 0 }, rotating = false;
        const genToken = () => String(Math.floor(100000 + Math.random() * 900000));

        async function getToken() {
            if (supabaseClient) {
                const { data } = await supabaseClient.from('settings').select('exam_token, token_updated_at').eq('id', 1).single();
                if (data) return { code: data.exam_token, at: data.token_updated_at ? new Date(data.token_updated_at).getTime() : 0 };
            }
            return curToken;
        }
        async function rotateToken() {
            rotating = true;
            curToken = { code: genToken(), at: Date.now() };
            if (supabaseClient) {
                const { error } = await supabaseClient.from('settings').update({ exam_token: curToken.code, token_updated_at: new Date(curToken.at).toISOString() }).eq('id', 1);
                if (error) showModal('Gagal Menyimpan Token', error.message + ' — pastikan kolom exam_token & token_updated_at sudah dibuat di tabel settings.', 'error');
            }
            rotating = false;
            return curToken;
        }

        async function renderTokenTab(area) {
            area.innerHTML = `
                <h3 class="text-base font-bold text-white mb-1"><i class="fa-solid fa-key text-amber-400 mr-2"></i>Token Ujian Otomatis</h3>
                <p class="text-xs text-slate-400 mb-4">Token acak 6 digit diganti otomatis tiap 15 menit. Bacakan/tampilkan token ini kepada siswa di ruang ujian. <strong class="text-amber-400">Biarkan halaman ini tetap terbuka selama ujian</strong> agar token terus diperbarui.</p>
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-8 text-center max-w-md">
                    <div id="tok-code" class="text-5xl sm:text-6xl font-mono font-extrabold tracking-[0.3em] text-amber-400 pl-4">------</div>
                    <p class="text-xs text-slate-400 mt-3">Berganti otomatis dalam <span id="tok-left" class="font-mono text-white">--:--</span></p>
                    <button onclick="manualRotateToken()" class="mt-5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-4 py-2 rounded-xl"><i class="fa-solid fa-rotate mr-1"></i> Acak Token Sekarang</button>
                </div>`;
            let t = await getToken();
            curToken = t;
            if (!t.code || Date.now() - t.at >= TOKEN_MS) await rotateToken();
            const tick = async () => {
                const codeEl = document.getElementById('tok-code');
                if (!codeEl) { clearInterval(tokenTimer); return; }
                let left = TOKEN_MS - (Date.now() - curToken.at);
                if (left <= 0 && !rotating) { await rotateToken(); left = TOKEN_MS; }
                codeEl.innerText = curToken.code || '------';
                const s = Math.max(0, Math.round(left / 1000));
                document.getElementById('tok-left').innerText = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
            };
            await tick();
            clearInterval(tokenTimer);
            tokenTimer = setInterval(tick, 1000);
        }
        async function manualRotateToken() { await rotateToken(); }

        // ==========================================

        // ==========================================
        function downloadCSV(filename, rows) {
            const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
            a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        }

        function parseCSV(text) {
            text = text.replace(/^\ufeff/, '');
            const first = text.split(/\r?\n/)[0] || '';
            const d = first.split(';').length > first.split(',').length ? ';' : ',';
            const rows = []; let row = [], cur = '', q = false;
            const endRow = () => { row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row.map(x => x.trim())); row = []; };
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
                else if (c === '"') q = true;
                else if (c === d) { row.push(cur); cur = ''; }
                else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; endRow(); }
                else cur += c;
            }
            endRow();
            return rows;
        }

        function downloadStudentTemplate() {
            downloadCSV('template_siswa.csv', [['nisn', 'name', 'kelas', 'pin'], ['0081234567', 'Contoh Nama Siswa', 'XI TKJ', '12345']]);

        async function importStudentsCSV(input) {
            const file = input.files[0]; input.value = '';
            if (!file) return;
            const rows = parseCSV(await file.text());
            if (rows.length < 2) { showModal('CSV Kosong', 'File tidak berisi data. Gunakan kolom: nisn, name, kelas, pin.', 'error'); return; }
            const head = rows[0].map(h => h.toLowerCase());
            const idx = k => head.indexOf(k);
            const hasHeader = idx('nisn') >= 0;
            const col = hasHeader ? { nisn: idx('nisn'), name: idx('name') >= 0 ? idx('name') : idx('nama'), kelas: idx('kelas'), pin: idx('pin') } : { nisn: 0, name: 1, kelas: 2, pin: 3 };
            if (col.name < 0 || col.kelas < 0) { showModal('Format CSV Salah', 'Kolom wajib: nisn, name, kelas (pin opsional).', 'error'); return; }

            const seen = new Set(), valid = []; let invalid = 0, dupFile = 0;
            rows.slice(hasHeader ? 1 : 0).forEach(r => {
                const nisn = (r[col.nisn] || '').trim(), name = (r[col.name] || '').trim(), kelas = (r[col.kelas] || '').trim();
                const pin = col.pin >= 0 && r[col.pin] ? r[col.pin].trim() : '12345';
                if (!nisn || !name || !kelas) { invalid++; return; }
                if (seen.has(nisn)) { dupFile++; return; }
                seen.add(nisn); valid.push({ nisn, name, kelas, pin });
            });

            let existing = new Set();
            if (supabaseClient) {
                const { data } = await supabaseClient.from('students').select('nisn').limit(10000);
                existing = new Set((data || []).map(s => String(s.nisn)));
            }
            const toInsert = valid.filter(s => !existing.has(s.nisn));
            const skipped = valid.length - toInsert.length;
            if (!confirm(`Ditemukan ${toInsert.length} siswa baru untuk diunggah.\nDilewati: ${skipped} NISN sudah ada, ${dupFile} duplikat di file, ${invalid} baris tidak lengkap.\n\nLanjutkan?`)) return;

            if (supabaseClient) {
                for (let i = 0; i < toInsert.length; i += 200) {
                    const { error } = await supabaseClient.from('students').insert(toInsert.slice(i, i + 200));
                    if (error) { showModal('Upload Gagal', `Terhenti pada baris ${i + 1}: ${error.message}`, 'error'); adminTab('students'); return; }
                }
            }
            showModal('Upload Berhasil', `${toInsert.length} siswa ditambahkan. ${skipped + dupFile + invalid} baris dilewati.`);
            adminTab('students');
        }

        function recapRows() {
            const exId = document.getElementById('rc-exam').value, kl = document.getElementById('rc-kelas').value;
            const exMap = Object.fromEntries(recapState.exams.map(e => [e.id, e]));
            const klMap = Object.fromEntries(recapState.students.map(s => [String(s.nisn), s.kelas]));
            return recapState.results
                .filter(r => (exId === 'all' || String(r.exam_id) === exId) && (kl === 'all' || klMap[String(r.student_nisn)] === kl))
                .map(r => ({
                    nisn: r.student_nisn, name: r.student_name, kelas: klMap[String(r.student_nisn)] || '-',
                    subject: exMap[r.exam_id]?.subject || '-', title: exMap[r.exam_id]?.title || '-',
                    score: Number(r.score) || 0, correct: r.correct_count ?? '', total: r.total_questions ?? '',
                    violations: r.violations ?? '', time: r.submitted_at || r.created_at || ''
                }))
                .sort((a, b) => a.kelas.localeCompare(b.kelas) || a.name.localeCompare(b.name));
        }
        const fmtTime = t => t ? new Date(t).toLocaleString('id-ID') : '-';

        function applyRecap() {
            const rows = recapRows();
            const scores = rows.map(r => r.score);
            const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '-';
            document.getElementById('recap-table').innerHTML = `
                <p class="text-xs text-slate-400 mb-2">${rows.length} hasil &bull; Rata-rata: <b class="text-white">${avg}</b> &bull; Tertinggi: <b class="text-white">${scores.length ? Math.max(...scores) : '-'}</b> &bull; Terendah: <b class="text-white">${scores.length ? Math.min(...scores) : '-'}</b></p>
                <div class="overflow-x-auto"><table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 uppercase"><tr><th class="p-3">NISN</th><th class="p-3">Nama</th><th class="p-3">Kelas</th><th class="p-3">Mapel</th><th class="p-3 text-center">Nilai</th><th class="p-3 text-center">Pindah Tab</th><th class="p-3">Waktu Kumpul</th></tr></thead>
                    <tbody class="divide-y divide-slate-700">${rows.length ? rows.map(r => `<tr><td class="p-3 font-mono">${esc(r.nisn)}</td><td class="p-3 font-semibold text-white">${esc(r.name)}</td><td class="p-3">${esc(r.kelas)}</td><td class="p-3">${esc(r.subject)}</td><td class="p-3 text-center font-bold text-emerald-400">${r.score.toFixed(1)}</td><td class="p-3 text-center">${r.violations === '' ? '-' : r.violations}</td><td class="p-3">${fmtTime(r.time)}</td></tr>`).join('') : '<tr><td colspan="7" class="p-4 text-center text-slate-500">Belum ada hasil ujian.</td></tr>'}</tbody>
                </table></div>`;
        }

        function exportRecapCSV() {
            const rows = recapRows();
            if (!rows.length) { showModal('Tidak Ada Data', 'Belum ada hasil ujian untuk diunduh.', 'error'); return; }
            downloadCSV(`rekap_nilai_${new Date().toISOString().slice(0, 10)}.csv`,
                [['No', 'NISN', 'Nama', 'Kelas', 'Mata Pelajaran', 'Judul Ujian', 'Nilai', 'Benar', 'Jumlah Soal', 'Pindah Tab', 'Waktu Kumpul']]
                    .concat(rows.map((r, i) => [i + 1, r.nisn, r.name, r.kelas, r.subject, r.title, r.score, r.correct, r.total, r.violations, fmtTime(r.time)])));
        }

        function printBA() {
            const rows = recapRows();
            const exId = document.getElementById('rc-exam').value, kl = document.getElementById('rc-kelas').value;
            const ex = recapState.exams.find(e => String(e.id) === exId);
            const kelasTarget = kl !== 'all' ? kl : (ex ? ex.kelas : null);
            const terdaftar = recapState.students.filter(s => !kelasTarget || s.kelas === kelasTarget).length;
            const hadir = rows.length, tidak = Math.max(0, terdaftar - hadir);
            const scores = rows.map(r => r.score);
            const v = id => document.getElementById(id).value.trim();
            const tgl = new Date(v('rc-tgl') + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            const line = '<span style="display:inline-block;min-width:60mm;border-bottom:1px dotted #000">&nbsp;</span>';
            document.getElementById('print-area').innerHTML = `
                <div class="ba">
                    <h2>BERITA ACARA PELAKSANAAN<br>PENILAIAN SUMATIF AKHIR SEMESTER ${esc(currentSettings.semester).toUpperCase()}</h2>
                    <p style="text-align:center;margin:1mm 0 6mm">${esc(currentSettings.school_name)} &bull; Tahun Pelajaran ${esc(currentSettings.academic_year)}</p>
                    <p>Pada hari ini <b>${tgl}</b>, telah diselenggarakan Penilaian Sumatif Akhir Semester berbasis komputer (CBT) dengan keterangan sebagai berikut:</p>
                    <table class="info">
                        <tr><td>1.</td><td>Mata Pelajaran</td><td>: ${esc(ex ? ex.subject + ' - ' + ex.title : 'Semua mata pelajaran')}</td></tr>
                        <tr><td>2.</td><td>Kelas</td><td>: ${esc(kelasTarget || 'Semua kelas')}</td></tr>
                        <tr><td>3.</td><td>Ruang / Sesi</td><td>: ${esc(v('rc-ruang')) || line}</td></tr>
                        <tr><td>4.</td><td>Peserta terdaftar</td><td>: ${terdaftar} orang</td></tr>
                        <tr><td>5.</td><td>Peserta hadir (mengumpulkan)</td><td>: ${hadir} orang</td></tr>
                        <tr><td>6.</td><td>Peserta tidak hadir</td><td>: ${tidak} orang</td></tr>
                        <tr><td>7.</td><td>Nilai rata-rata / tertinggi / terendah</td><td>: ${scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) + ' / ' + Math.max(...scores) + ' / ' + Math.min(...scores) : '-'}</td></tr>
                        <tr><td>8.</td><td>Catatan selama ujian</td><td>: ${esc(v('rc-catatan')) || line}</td></tr>
                    </table>
                    <p style="margin-top:4mm">Demikian berita acara ini dibuat dengan sebenarnya untuk dipergunakan sebagaimana mestinya.</p>
                    <div class="sign">
                        <div>Pengawas Ujian,<br><br><br><br><b><u>${esc(v('rc-pengawas')) || '.............................'}</u></b></div>
                        <div>Mengetahui,<br>Kepala Sekolah<br><br><br><b><u>${esc(currentSettings.headmaster_name)}</u></b><br>NIP. ${esc(currentSettings.headmaster_nip)}</div>
                    </div>
                    <div style="page-break-before:always"></div>
                    <h2 style="font-size:12pt">LAMPIRAN DAFTAR NILAI PESERTA</h2>
                    <table class="list"><thead><tr><th>No</th><th>NISN</th><th>Nama</th><th>Kelas</th><th>Mapel</th><th>Nilai</th></tr></thead>
                    <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.nisn)}</td><td>${esc(r.name)}</td><td>${esc(r.kelas)}</td><td>${esc(r.subject)}</td><td>${r.score.toFixed(1)}</td></tr>`).join('')}</tbody></table>
                </div>`;
            window.print();
        }

    </script>
</body>
</html>
