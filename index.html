<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Penilaian Sumatif Akhir Semester - SMKN 1 Wakatobi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex flex-col h-screen overflow-hidden">

    <!-- Top Bar Pengaturan Tampilan & Koneksi -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-2 flex justify-between items-center text-xs z-50">
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <span class="font-semibold text-emerald-400">CBT SMKN 1 Wakatobi PWA</span>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-slate-400 hidden sm:inline">Ubah Tampilan Perangkat:</span>
            <div class="inline-flex rounded-md shadow-sm" role="group">
                <button onclick="setDeviceMode('mobile')" id="btn-mobile" class="px-3 py-1.5 text-xs font-medium bg-slate-700 text-white rounded-l-lg hover:bg-slate-600 border border-slate-600 transition">
                    <i class="fa-solid fa-mobile-screen mr-1"></i> HP
                </button>
                <button onclick="setDeviceMode('desktop')" id="btn-desktop" class="px-3 py-1.5 text-xs font-medium bg-slate-900 text-slate-300 rounded-r-lg hover:bg-slate-700 border border-slate-600 transition">
                    <i class="fa-solid fa-desktop mr-1"></i> Desktop
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container dengan Dynamic Device Wrapper -->
    <main class="flex-1 flex justify-center items-center bg-slate-950 p-0 sm:p-4 overflow-hidden">
        <div id="device-container" class="device-frame-desktop w-full bg-slate-900 flex flex-col transition-all duration-300 relative shadow-2xl">
            
            <!-- App Header (Branding SMKN 1 Wakatobi) -->
            <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white p-4 border-b border-indigo-800 flex justify-between items-center shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2.5 rounded-xl shadow">
                        <i class="fa-solid fa-graduation-cap text-xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm sm:text-base tracking-wide" id="lbl-school-name">SMKN 1 Wakatobi</h1>
                        <p class="text-xs text-blue-200" id="lbl-semester-info">Penilaian Sumatif Akhir Semester (SAS)</p>
                    </div>
                </div>
                <div id="header-auth-status">
                    <!-- Dynamic Auth Status / Logout Button -->
                </div>
            </div>

            <!-- App Body Content Area -->
            <div id="app-content" class="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-900">
                <!-- Rendered dynamically -->
            </div>

            <!-- Footer -->
            <footer class="bg-slate-900 border-t border-slate-800 py-2 text-center text-xs text-slate-500">
                &copy; 2026 Tim Kurikulum SMKN 1 Wakatobi &bull; Supabase Backend Connected
            </footer>

        </div>
    </main>

    <!-- Modal Notifikasi / Alert Global -->
    <div id="global-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div id="modal-icon" class="text-4xl mb-3 text-emerald-400">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-white mb-1">Berhasil</h3>
            <p id="modal-message" class="text-sm text-slate-300 mb-6">Pesan informasi sistem.</p>
            <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg">OK</button>
        </div>
    </div>

    <!-- Area cetak (kartu peserta & berita acara) -->
    <div id="print-area"></div>

    <!-- Script Logika Aplikasi -->
    <!-- Modul aplikasi (urutan penting: berbagi variabel global) -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-students-csv.js"></script>
    <script src="js/admin-token.js"></script>
    <script src="js/admin-cards.js"></script>
    <script src="js/admin-recap.js"></script>
    <script src="js/teacher.js"></script>
    <script src="js/student.js"></script>
    <script src="js/exam-engine.js"></script>
</body>
</html>
